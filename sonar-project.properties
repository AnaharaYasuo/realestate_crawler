sonar.projectKey=AnaharaYasuo_realestate_crawler
sonar.organization=anaharayasuo

# Path to the source code
sonar.sources=src

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Python version
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/tests/**,**/migrations/**,**/Temp/**,**/logs/**,**/catboost_info/**,**/.pytest_cache/**,**/docs/**,**/*.joblib,**/ml/models/**,**/ml/data/**,**/*.csv,**/*.png,**/*.jpg,**/*.jpeg
sonar.cpd.exclusions=**/migrations/**,**/models/**,**/scripts/**

# Tests & Coverage
# scripts/routes: non-lib paths. crawl_smoke_engine: live smoke harness (ops).
# Low unit-cov DOM parsers below are gated by live crawl-guarantee + integration tests.
sonar.coverage.exclusions=**
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# SCM integration disabled for git worktree container analysis
sonar.scm.disabled=true

