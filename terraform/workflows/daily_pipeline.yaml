# Cloud Workflows Definition: Real Estate Pipeline Daily Orchestration
# 7時間 (25,200s) の全体タイムアウト枠内で、ProxySQL起動 -> クロール (5h上限) -> ML学習 -> バルク価格推定・お宝配信 -> ProxySQL停止を一貫実行
main:
  params: [args]
  steps:
    - initVars:
        assign:
          - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: "asia-northeast1"
          - zone: "asia-northeast1-b"
          - proxysqlInstance: "proxysql-instance-prod"
          - crawlerJob: "realestate-crawler-pipeline-prod"
          - mlPipelineJob: "realestate-ml-pipeline-prod"
          - crawlTimeoutSec: 18000  # 5時間 (18,000s)

    - tryPipeline:
        try:
          steps:
            - startProxySQL:
                call: googleapis.compute.v1.instances.start
                args:
                  project: ${projectId}
                  zone: ${zone}
                  instance: ${proxysqlInstance}

            - waitProxySQLReady:
                call: sys.sleep
                args:
                  seconds: 25

            - runCrawlerTasks:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + projectId + "/locations/" + location + "/jobs/" + crawlerJob}
                result: crawlerExecution

            - waitCrawlerCompletion:
                call: monitorJobExecution
                args:
                  executionName: ${crawlerExecution.name}
                  timeoutSec: ${crawlTimeoutSec}

            - runMLAndEstimation:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + projectId + "/locations/" + location + "/jobs/" + mlPipelineJob}
                result: mlExecution

            - waitMLCompletion:
                call: monitorJobExecution
                args:
                  executionName: ${mlExecution.name}
                  timeoutSec: 7200  # 2時間
        finally:
          steps:
            - stopProxySQL:
                call: googleapis.compute.v1.instances.stop
                args:
                  project: ${projectId}
                  zone: ${zone}
                  instance: ${proxysqlInstance}

# Subworkflow for polling Cloud Run Job execution until completed or timeout
monitorJobExecution:
  params: [executionName, timeoutSec]
  steps:
    - initTimer:
        assign:
          - startTime: ${sys.now()}
          - sleepInterval: 30

    - checkStatusLoop:
        call: googleapis.run.v2.projects.locations.jobs.executions.get
        args:
          name: ${executionName}
        result: execDetails

    - evaluateState:
        switch:
          - condition: ${default(execDetails.runningCount, 0) == 0 and default(execDetails.reconciling, false) == false}
            return: ${execDetails}
          - condition: ${(sys.now() - startTime) > timeoutSec}
            raise:
              error: "JobExecutionTimeout"
              message: '${"Job execution exceeded timeout: " + string(timeoutSec) + "s"}'

    - waitAndRetry:
        call: sys.sleep
        args:
          seconds: ${sleepInterval}
        next: checkStatusLoop
