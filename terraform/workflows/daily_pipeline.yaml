# Cloud Workflows Definition: Real Estate Pipeline Daily Orchestration
# 7時間 (25,200s) の全体タイムアウト枠内で、ProxySQL起動 -> クロール (5h上限) -> ML学習 -> バルク価格推定・お宝配信 -> ProxySQL停止を一貫実行
main:
  params: [args]
  steps:
    - initVars:
        assign:
          - pipelineStart: ${sys.now()}
          - maxPipelineDurationSec: 39600  # 11時間 (39,600s)
          - projectId: ${default(map.get(args, "projectId"), sys.get_env("GOOGLE_CLOUD_PROJECT_ID"))}
          - location: ${default(map.get(args, "location"), "asia-northeast1")}
          - zone: ${default(map.get(args, "zone"), "asia-northeast1-a")}
          - proxysqlInstance: ${default(map.get(args, "proxysqlInstance"), "proxysql-instance-prod")}
          - crawlerJob: ${default(map.get(args, "crawlerJob"), "realestate-crawler-pipeline-prod")}
          - mlPipelineJob: ${default(map.get(args, "mlPipelineJob"), "realestate-ml-pipeline-prod")}
          - rawCrawlTimeoutSec: ${default(map.get(args, "crawlTimeoutSec"), 32400)}  # 9時間 (32,400s)
          - crawlTimeoutSec: ${int(math.min(rawCrawlTimeoutSec, maxPipelineDurationSec - 3600))}
          - crawlerFailed: false
          - crawlerError: null
          - company: ${default(map.get(args, "company"), null)}
          - propertyType: ${default(map.get(args, "propertyType"), default(map.get(args, "type"), null))}
          - sites: ${default(map.get(args, "sites"), null)}
          - skipPortals: ${default(map.get(args, "skipPortals"), true)}
          - explicitTaskCount: ${default(map.get(args, "taskCount"), null)}
          - skipTrain: ${default(map.get(args, "skipTrain"), true)}
          - crawlerArgs: []
          - effectiveTaskCount: null
          - mlArgs: ["--force", "--skip-train"]

    - buildCrawlerArgs:
        steps:
          - checkCompany:
              switch:
                - condition: ${company != null}
                  assign:
                    - crawlerArgs: ${list.concat(crawlerArgs, ["--company=" + string(company)])}
          - checkPropertyType:
              switch:
                - condition: ${propertyType != null}
                  assign:
                    - crawlerArgs: ${list.concat(crawlerArgs, ["--property-type=" + string(propertyType)])}
          - checkSites:
              switch:
                - condition: ${sites != null}
                  assign:
                    - crawlerArgs: ${list.concat(crawlerArgs, ["--sites=" + string(sites)])}
          - checkSkipPortals:
              switch:
                - condition: ${skipPortals}
                  assign:
                    - crawlerArgs: ${list.concat(crawlerArgs, ["--skip-portals"])}
                    - mlArgs: ${list.concat(mlArgs, ["--skip-portals"])}
          - checkTaskCount:
              switch:
                - condition: ${explicitTaskCount != null}
                  assign:
                    - effectiveTaskCount: ${int(explicitTaskCount)}
                - condition: ${company != null or propertyType != null or sites != null}
                  # 単一会社または明示的絞り込み時はコンテナ起動数を動的に抑制 (不要コンテナの起動を抑止)
                  assign:
                    - effectiveTaskCount: 1
                - condition: ${skipPortals}
                  # ポータル除外時: Task 5(homes), 6(athome mansion), 7(athome other) を除外して 5 タスクに抑制
                  assign:
                    - effectiveTaskCount: 5

    - tryPipeline:
        try:
          steps:
            - startProxySQL:
                call: googleapis.compute.v1.instances.start
                args:
                  project: ${projectId}
                  zone: ${zone}
                  instance: ${proxysqlInstance}

            - waitProxySQLReady:
                call: sys.sleep
                args:
                  seconds: 25

            - runCrawlerTasks:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + projectId + "/locations/" + location + "/jobs/" + crawlerJob}
                  body:
                    overrides:
                      taskCount: ${effectiveTaskCount}
                      containerOverrides:
                        - args: ${crawlerArgs}
                  connector_params:
                    skip_polling: true
                result: crawlerOperation

            - resolveCrawlerExecution:
                assign:
                  - crawlerExecutionName: ${default(map.get(map.get(crawlerOperation, "response"), "name"), map.get(map.get(crawlerOperation, "metadata"), "name"))}

            - waitCrawlerCompletion:
                try:
                  call: monitorJobExecution
                  args:
                    executionName: ${crawlerExecutionName}
                    timeoutSec: ${crawlTimeoutSec}
                except:
                  as: crawlErr
                  steps:
                    - recordCrawlError:
                        assign:
                          - crawlerFailed: true
                          - crawlerError: ${crawlErr}

            - calculateRemainingTime:
                assign:
                  - elapsedSoFar: ${sys.now() - pipelineStart}
                  - remainingMLTimeout: ${maxPipelineDurationSec - elapsedSoFar - 300}  # ProxySQL停止用5分バッファを確保
                  - mlEffectiveTimeout: ${int(math.max(math.min(7200, remainingMLTimeout), 60))}

            - checkMLDeadline:
                switch:
                  - condition: ${remainingMLTimeout < 60}
                    next: stopProxySQLOnSuccess

            - runMLAndEstimation:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + projectId + "/locations/" + location + "/jobs/" + mlPipelineJob}
                  body:
                    overrides:
                      containerOverrides:
                        - args: ${mlArgs}
                  connector_params:
                    skip_polling: true
                result: mlOperation

            - resolveMLExecution:
                assign:
                  - mlExecutionName: ${default(map.get(map.get(mlOperation, "response"), "name"), map.get(map.get(mlOperation, "metadata"), "name"))}

            - waitMLCompletion:
                call: monitorJobExecution
                args:
                  executionName: ${mlExecutionName}
                  timeoutSec: ${mlEffectiveTimeout}
        except:
          as: pipelineError
          steps:
            - stopProxySQLOnError:
                try:
                  call: googleapis.compute.v1.instances.stop
                  args:
                    project: ${projectId}
                    zone: ${zone}
                    instance: ${proxysqlInstance}
                except:
                  as: stopErr
                  steps:
                    - logStopError:
                        assign:
                          - ignoredStopErr: ${stopErr}
            - rethrowPipelineError:
                raise: ${pipelineError}

    - stopProxySQLOnSuccess:
        call: googleapis.compute.v1.instances.stop
        args:
          project: ${projectId}
          zone: ${zone}
          instance: ${proxysqlInstance}

    - checkFinalStatus:
        switch:
          - condition: ${crawlerFailed}
            raise:
              error: "CrawlerPhaseFailed"
              message: '${"Crawler phase finished with failures, but ML estimation completed. Error: " + string(crawlerError)}'

# Subworkflow for polling Cloud Run Job execution until completed or timeout
monitorJobExecution:
  params: [executionName, timeoutSec]
  steps:
    - initTimer:
        assign:
          - startTime: ${sys.now()}
          - sleepInterval: 30
          - consecutiveGetErrors: 0

    - checkStatusLoop:
        try:
          steps:
            - getExecution:
                call: googleapis.run.v2.projects.locations.jobs.executions.get
                args:
                  name: ${executionName}
                result: execDetails
            - resetGetErrors:
                assign:
                  - consecutiveGetErrors: 0
        except:
          as: getErr
          steps:
            - logGetError:
                assign:
                  - ignoredGetErr: ${getErr}
                  - consecutiveGetErrors: ${consecutiveGetErrors + 1}
            - checkGetErrorThreshold:
                switch:
                  - condition: ${consecutiveGetErrors >= 3}
                    raise:
                      error: "JobExecutionNotFound"
                      message: '${"Job execution disappeared or failed to fetch after 3 consecutive attempts: " + string(executionName) + " (last error: " + string(getErr) + ")"}'
            - waitBeforeRetryGet:
                call: sys.sleep
                args:
                  seconds: 10
            - retryCheckStatus:
                try:
                  steps:
                    - retryGetExecution:
                        call: googleapis.run.v2.projects.locations.jobs.executions.get
                        args:
                          name: ${executionName}
                        result: execDetails
                    - resetGetErrorsOnRetry:
                        assign:
                          - consecutiveGetErrors: 0
                except:
                  as: retryErr
                  steps:
                    - logRetryError:
                        assign:
                          - ignoredRetryErr: ${retryErr}
                          - consecutiveGetErrors: ${consecutiveGetErrors + 1}
                    - checkGetErrorThresholdOnRetry:
                        switch:
                          - condition: ${consecutiveGetErrors >= 3}
                            raise:
                              error: "JobExecutionNotFound"
                              message: '${"Job execution disappeared or failed to fetch after 3 consecutive attempts: " + string(executionName) + " (last error: " + string(retryErr) + ")"}'
                    - checkTimeoutOnRetryErr:
                        switch:
                          - condition: ${(sys.now() - startTime) > timeoutSec}
                            next: cancelRunningJob
                          - condition: true
                            next: waitAndRetry

    - evaluateState:
        switch:
          - condition: ${default(map.get(execDetails, "runningCount"), 0) == 0 and default(map.get(execDetails, "reconciling"), false) == false and map.get(execDetails, "completionTime") != null}
            steps:
              - checkExecutionResult:
                  switch:
                    - condition: ${default(map.get(execDetails, "failedCount"), 0) > 0 or default(map.get(execDetails, "cancelledCount"), 0) > 0}
                      raise:
                        error: "JobExecutionFailed"
                        message: '${"Job execution finished with failures: failed=" + string(default(map.get(execDetails, "failedCount"), 0)) + ", cancelled=" + string(default(map.get(execDetails, "cancelledCount"), 0))}'
                    - condition: true
                      return: ${execDetails}
          - condition: ${(sys.now() - startTime) > timeoutSec}
            steps:
              - cancelRunningJob:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.executions.cancel
                    args:
                      name: ${executionName}
                      body: {}
                  except:
                    as: cancelErr
                    steps:
                      - logCancelError:
                          assign:
                            - ignoredCancelErr: ${cancelErr}
              - raiseTimeout:
                  raise:
                    error: "JobExecutionTimeout"
                    message: '${"Job execution exceeded timeout: " + string(timeoutSec) + "s"}'

    - waitAndRetry:
        call: sys.sleep
        args:
          seconds: ${sleepInterval}
        next: checkStatusLoop
