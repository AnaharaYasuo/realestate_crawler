# Cloud Workflows Definition: Real Estate Anomaly Recrawl Pipeline Orchestration (Issue #738)
# 5時間 (18,000s) の全体タイムアウト枠内で、ProxySQL起動 -> 25秒待機 -> recrawl_anomalies実行 -> ProxySQL停止を一貫実行
main:
  params: [args]
  steps:
    - initVars:
        assign:
          - pipelineStart: ${sys.now()}
          - maxPipelineDurationSec: 32400  # 9時間 (32,400s: 通常クローラーと同一)
          - projectId: ${default(map.get(args, "projectId"), sys.get_env("GOOGLE_CLOUD_PROJECT_ID"))}
          - location: ${default(map.get(args, "location"), "asia-northeast1")}
          - zone: ${default(map.get(args, "zone"), "asia-northeast1-a")}
          - proxysqlInstance: ${default(map.get(args, "proxysqlInstance"), "proxysql-instance-prod")}
          - recrawlJob: ${default(map.get(args, "recrawlJob"), "realestate-recrawl-anomalies-prod")}
          - rawTimeoutSec: ${default(map.get(args, "timeoutSec"), 32400)}
          - recrawlTimeoutSec: ${int(math.min(rawTimeoutSec, maxPipelineDurationSec - 300))} # 停止用5分バッファを確保
          - concurrency: ${default(map.get(args, "concurrency"), null)}
          - limit: ${default(map.get(args, "limit"), null)}
          - taskCount: ${default(map.get(args, "taskCount"), null)}
          - recrawlArgs: []

    - buildArgs:
        steps:
          - checkConcurrency:
              switch:
                - condition: ${concurrency != null}
                  assign:
                    - recrawlArgs: ${list.concat(recrawlArgs, ["--concurrency=" + string(concurrency)])}
          - checkLimit:
              switch:
                - condition: ${limit != null}
                  assign:
                    - recrawlArgs: ${list.concat(recrawlArgs, ["--limit=" + string(limit)])}
          - checkTaskCount:
              switch:
                - condition: ${taskCount != null}
                  assign:
                    - recrawlArgs: ${list.concat(recrawlArgs, ["--task-count=" + string(taskCount)])}

    - tryPipeline:
        try:
          steps:
            - startProxySQL:
                call: googleapis.compute.v1.instances.start
                args:
                  project: ${projectId}
                  zone: ${zone}
                  instance: ${proxysqlInstance}

            - waitProxySQLReady:
                call: sys.sleep
                args:
                  seconds: 25

            - runRecrawlTask:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + projectId + "/locations/" + location + "/jobs/" + recrawlJob}
                  body:
                    overrides:
                      containerOverrides:
                        - args: ${recrawlArgs}
                  connector_params:
                    skip_polling: true
                result: recrawlOperation

            - resolveRecrawlExecution:
                assign:
                  - recrawlExecutionName: ${default(map.get(map.get(recrawlOperation, "response"), "name"), map.get(map.get(recrawlOperation, "metadata"), "name"))}

            - waitRecrawlCompletion:
                call: monitorJobExecution
                args:
                  executionName: ${recrawlExecutionName}
                  timeoutSec: ${recrawlTimeoutSec}
        except:
          as: pipelineError
          steps:
            - stopProxySQLOnError:
                try:
                  call: googleapis.compute.v1.instances.stop
                  args:
                    project: ${projectId}
                    zone: ${zone}
                    instance: ${proxysqlInstance}
                except:
                  as: stopErr
                  steps:
                    - logStopError:
                        assign:
                          - ignoredStopErr: ${stopErr}
            - rethrowPipelineError:
                raise: ${pipelineError}

    - stopProxySQLOnSuccess:
        call: googleapis.compute.v1.instances.stop
        args:
          project: ${projectId}
          zone: ${zone}
          instance: ${proxysqlInstance}

    - finish:
        return: "Recrawl anomalies completed successfully."

# Subworkflow for polling Cloud Run Job execution until completed or timeout
monitorJobExecution:
  params: [executionName, timeoutSec]
  steps:
    - initTimer:
        assign:
          - startTime: ${sys.now()}
          - sleepInterval: 30
          - consecutiveGetErrors: 0

    - checkStatusLoop:
        try:
          steps:
            - getExecution:
                call: googleapis.run.v2.projects.locations.jobs.executions.get
                args:
                  name: ${executionName}
                result: execDetails
            - resetGetErrors:
                assign:
                  - consecutiveGetErrors: 0
        except:
          as: getErr
          steps:
            - logGetError:
                assign:
                  - ignoredGetErr: ${getErr}
                  - consecutiveGetErrors: ${consecutiveGetErrors + 1}
            - checkGetErrorThreshold:
                switch:
                  - condition: ${consecutiveGetErrors >= 3}
                    raise:
                      error: "JobExecutionNotFound"
                      message: '${"Job execution disappeared or failed to fetch after 3 consecutive attempts: " + string(executionName) + " (last error: " + string(getErr) + ")"}'
            - waitBeforeRetryGet:
                call: sys.sleep
                args:
                  seconds: 10
            - retryCheckStatus:
                try:
                  steps:
                    - retryGetExecution:
                        call: googleapis.run.v2.projects.locations.jobs.executions.get
                        args:
                          name: ${executionName}
                        result: execDetails
                    - resetGetErrorsOnRetry:
                        assign:
                          - consecutiveGetErrors: 0
                except:
                  as: retryErr
                  steps:
                    - logRetryError:
                        assign:
                          - ignoredRetryErr: ${retryErr}
                          - consecutiveGetErrors: ${consecutiveGetErrors + 1}
                    - checkGetErrorThresholdOnRetry:
                        switch:
                          - condition: ${consecutiveGetErrors >= 3}
                            raise:
                              error: "JobExecutionNotFound"
                              message: '${"Job execution disappeared or failed to fetch after 3 consecutive attempts: " + string(executionName) + " (last error: " + string(retryErr) + ")"}'
                    - checkTimeoutOnRetryErr:
                        switch:
                          - condition: ${(sys.now() - startTime) > timeoutSec}
                            next: cancelRunningJob
                          - condition: true
                            next: waitAndRetry

    - evaluateState:
        switch:
          - condition: ${default(map.get(execDetails, "runningCount"), 0) == 0 and default(map.get(execDetails, "reconciling"), false) == false and map.get(execDetails, "completionTime") != null}
            steps:
              - checkExecutionResult:
                  switch:
                    - condition: ${default(map.get(execDetails, "failedCount"), 0) > 0 or default(map.get(execDetails, "cancelledCount"), 0) > 0}
                      raise:
                        error: "JobExecutionFailed"
                        message: '${"Recrawl job finished with failures: failed=" + string(default(map.get(execDetails, "failedCount"), 0)) + ", cancelled=" + string(default(map.get(execDetails, "cancelledCount"), 0))}'
                    - condition: true
                      return: ${execDetails}
          - condition: ${(sys.now() - startTime) > timeoutSec}
            steps:
              - cancelRunningJob:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.executions.cancel
                    args:
                      name: ${executionName}
                      body: {}
                  except:
                    as: cancelErr
                    steps:
                      - logCancelError:
                          assign:
                            - ignoredCancelErr: ${cancelErr}
              - raiseTimeout:
                  raise:
                    error: "JobExecutionTimeout"
                    message: '${"Job execution exceeded timeout: " + string(timeoutSec) + "s"}'

    - waitAndRetry:
        call: sys.sleep
        args:
          seconds: ${sleepInterval}
        next: checkStatusLoop
