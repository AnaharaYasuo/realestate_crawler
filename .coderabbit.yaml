# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  # docs / Markdown はコードレビュー対象外（書式・文言ノイズ防止）。Issue #345
  path_filters:
    - "!docs/**"
    - "!**/*.md"
  # パス別レビュー観点。Issue #363
  path_instructions:
    - path: "src/crawler/package/parser/**"
      instructions: >
        物件種別別 Base（Mansion/Kodate/Tochi/Investment）継承と抽象メソッド実装漏れ、
        フィールド名統一、セレクター堅牢性、1物件1AIリクエスト原則違反を優先して指摘すること。
    - path: "src/crawler/tests/**"
      instructions: >
        Issue 受入基準との対応、アサーションの弱さ（存在確認のみ等）、
        ミューテーション耐性の欠如を優先して指摘すること。
    - path: "src/crawler/scripts/**"
      instructions: >
        外部 API の有限タイムアウト、0件取得失敗分類、パスのハードコード禁止、
        連続タイムアウト Fast-Fail を優先して指摘すること。
  auto_review:
    enabled: true
    drafts: false
    # PR初回オープン時のみ自動レビュー。後続pushでの再レビュー連鎖を防止する。
    # 追加レビューが必要な場合は @coderabbitai review を手動実行する。
    auto_incremental_review: false
    base_branches:
      - "master"
    ignore_title_keywords:
      - "release:"
      - "[skip review]"
    ignore_usernames:
      - "github-actions[bot]"

  tools:
    ast-grep:
      enabled: true
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    # Markdown 非対象化に合わせ無効（Issue #345）
    markdownlint:
      enabled: false

tone_instructions: >
  日本の不動産情報クローラーおよび機械学習価格推定プロジェクトです。
  AGENTS.mdの開発原則（SDD/TDD原則、物件種別別Baseパーサー階層、1物件1AIリクエスト原則等）を尊重し、
  過剰なスタイルの指摘ではなく、潜在的なバグ、型不整合、境界値・欠損値の例外、パフォーマンス劣化、
  セキュリティ上の脆弱性に加え、スケーラビリティと長期保守性を中心に建設的かつ簡潔に指摘してください。

chat:
  auto_reply: true
