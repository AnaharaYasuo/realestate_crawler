# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    # PR初回オープン時のみ自動レビュー。後続pushでの再レビュー連鎖を防止する。
    # 追加レビューが必要な場合は @coderabbitai review を手動実行する。
    auto_incremental_review: false
    base_branches:
      - "master"
      - "production"
  tools:
    ast-grep:
      enabled: true
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

tone_instructions: >
  日本の不動産情報クローラーおよび機械学習価格推定プロジェクトです。
  AGENTS.mdの開発原則（SDD/TDD原則、物件種別別Baseパーサー階層、1物件1AIリクエスト原則等）を尊重し、
  過剰なスタイルの指摘ではなく、潜在的なバグ、型不整合、境界値・欠損値の例外、パフォーマンス劣化、
  セキュリティ上の脆弱性を中心に建設的かつ簡潔に指摘してください。

chat:
  auto_reply: true
