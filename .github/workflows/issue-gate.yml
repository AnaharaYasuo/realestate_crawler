name: Issue PR Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  verify-issue-association:
    name: Verify GitHub Issue Association
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Enforce Issue-Driven, Spec-Driven (SDD), and Test-Driven (TDD) Governance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { execFileSync } = require('child_process');

            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const bodyMatch = body.match(/\b(?:close[sd]?|fixe?[sd]?|resolve[sd]?)\s+#(\d+)\b/i);
            const issueNumber = bodyMatch && bodyMatch[1] ? parseInt(bodyMatch[1], 10) : null;

            let issueData = { exists: false };
            if (issueNumber) {
              try {
                const resp = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                issueData = {
                  exists: true,
                  number: resp.data.number,
                  state: resp.data.state,
                  is_pull_request: Boolean(resp.data.pull_request),
                  created_at: resp.data.created_at,
                  body: resp.data.body || ''
                };
              } catch (err) {
                issueData = { exists: false };
              }
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const payload = {
              repo_owner: context.repo.owner,
              repo_name: context.repo.repo,
              pr: {
                number: pr.number,
                title: pr.title || '',
                body: body,
                head_ref: pr.head && pr.head.ref ? pr.head.ref : '',
                user_login: pr.user && pr.user.login ? pr.user.login : '',
                created_at: pr.created_at || ''
              },
              issue: issueData,
              files: changedFiles.map(f => f.filename)
            };

            const stdout = execFileSync(
              'python3',
              ['src/crawler/package/utils/ci_governance_gate.py'],
              { input: JSON.stringify(payload), encoding: 'utf8' }
            );

            const verdict = JSON.parse(stdout);
            if (!verdict.passed) {
              if (verdict.comment_body) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: verdict.comment_body
                });
              }
              if (verdict.auto_close) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed'
                });
              }
              core.setFailed(verdict.fail_reason || 'CI Governance Gate failed.');
              return;
            }

            console.log(`✅ Verified Issue-Driven, Spec-Driven (SDD), and Test-Driven (TDD) compliance (Issue #${verdict.issue_number || 'exempt'}).`);
