name: Security Scan (Trivy, Semgrep, Checkov)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-scan:
    name: Trivy Security Scan (SCA & IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Trivy vulnerability scanner (SCA & IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'
          exit-code: '1'

      # SARIF アップロード: 初回PR時やmaster未マージ時のベースライン未存在エラーでPRがブロックされないよう continue-on-error: true を付与
      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: (success() || failure()) && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  semgrep-scan:
    name: Semgrep SAST Scan (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --severity ERROR \
            --exclude "src/crawler/scripts/ops" \
            --exclude "src/crawler/scripts/node" \
            --exclude "src/crawler/package/testing" \
            --exclude "src/crawler/tests" \
            --sarif \
            --output /src/semgrep.sarif \
            --error \
            src/

      # SARIF アップロード: 初回PR時やmaster未マージ時のベースライン未存在エラーでPRがブロックされないよう continue-on-error: true を付与
      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: (success() || failure()) && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep'

  checkov-scan:
    name: Checkov IaC & GCP Config Scan (Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Checkov は .checkov.yaml の除外ポリシーに基づき、未承認の誤設定検知時に CI を失敗させてブロック
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: 'terraform'
          framework: 'terraform'
          output_format: 'cli,sarif'
          output_file_path: 'console,results.sarif'
          config_file: '.checkov.yaml'
          soft_fail: false

      # SARIF アップロード: master未マージ時エラー除外のため continue-on-error: true を付与
      - name: Upload Checkov SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: (success() || failure()) && hashFiles('results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'results.sarif'
          category: 'checkov'
