# One-shot / rare ops: align SonarCloud Quality Gate with mergeable defaults.
# Uses GitHub Actions SONAR_TOKEN (local .env token may be empty).
name: Sonar Quality Gate Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "select_sonar_way | reset_new_code_30d"
        required: true
        default: "select_sonar_way"
        type: choice
        options:
          - select_sonar_way
          - reset_new_code_30d

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Apply SonarCloud ops
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG: anaharayasuo
          PROJECT: AnaharaYasuo_realestate_crawler
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is empty" >&2
            exit 1
          fi
          AUTH=(-u "${SONAR_TOKEN}:")
          case "${{ inputs.action }}" in
            select_sonar_way)
              # Built-in Sonar way gate id=9 (no overall violations<=0)
              curl -sS --fail-with-body --max-time 10 "${AUTH[@]}" \
                -X POST "https://sonarcloud.io/api/qualitygates/select?organization=${ORG}&projectKey=${PROJECT}&gateId=9"
              echo
              curl -sS --max-time 10 "${AUTH[@]}" \
                "https://sonarcloud.io/api/navigation/component?component=${PROJECT}&organization=${ORG}" \
                | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('qualityGate'))"
              ;;
            reset_new_code_30d)
              # Manual SPECIFIC_ANALYSIS baseline can point at a deleted analysis and
              # block all subsequent scans ("Unable to create analysis").
              # SonarCloud has no api/new_code_periods/* — use project_analyses + VERSION.
              code=$(curl -sS -o /tmp/nc_unset.json -w "%{http_code}" --max-time 10 "${AUTH[@]}" \
                -X POST "https://sonarcloud.io/api/project_analyses/unset_baseline?project=${PROJECT}&branch=master" || true)
              echo "unset_baseline HTTP ${code}"
              cat /tmp/nc_unset.json || true
              echo
              # Pick the newest analysis as a valid SPECIFIC_ANALYSIS baseline
              ANALYSIS=$(curl -sS --max-time 10 "${AUTH[@]}" \
                "https://sonarcloud.io/api/project_analyses/search?project=${PROJECT}&ps=1" \
                | python -c "import sys,json; print(json.load(sys.stdin)['analyses'][0]['key'])")
              echo "baseline_analysis=${ANALYSIS}"
              code=$(curl -sS -o /tmp/nc_set.json -w "%{http_code}" --max-time 10 "${AUTH[@]}" \
                -X POST "https://sonarcloud.io/api/project_analyses/set_baseline?project=${PROJECT}&branch=master&analysis=${ANALYSIS}")
              echo "set_baseline HTTP ${code}"
              cat /tmp/nc_set.json || true
              echo
              if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
                echo "set_baseline failed" >&2
                exit 1
              fi
              # Ensure a VERSION event exists so previous_version / version-named periods work
              curl -sS --fail-with-body --max-time 10 "${AUTH[@]}" \
                -X POST "https://sonarcloud.io/api/project_analyses/create_event?analysis=${ANALYSIS}&category=VERSION&name=baseline-$(date -u +%Y%m%d)"
              echo
              # Clear stale leak.period overrides (do NOT set value=30 — SonarCloud
              # treats bare numbers as VERSION names when type=previous_version).
              curl -sS --fail-with-body --max-time 10 "${AUTH[@]}" \
                -X POST "https://sonarcloud.io/api/settings/reset?keys=sonar.leak.period,sonar.leak.period.type&component=${PROJECT}"
              echo "reset leak.period done"
              ;;
          esac
