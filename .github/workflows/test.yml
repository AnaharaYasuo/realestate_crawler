name: Parser Tests

on:
  pull_request:
    branches: [ main, master, production ]
  push:
    branches: [ main, master, production ]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'config/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pytest.ini'
              - '.github/workflows/test.yml'

  test-matrix:
    name: Test (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
            name: Unit Tests
            command: docker compose exec -T app pytest -n auto src/crawler/tests/unit/
          - group: integration
            name: Integration Tests
            command: docker compose exec -T app pytest -n auto src/crawler/tests/integration/
          - group: ml-pipeline
            name: ML & Pipeline Tests
            command: docker compose exec -T app pytest -n auto src/crawler/tests/test_ml_pipeline.py src/crawler/tests/test_image_handler.py
          - group: mutation
            name: PR Mutation Tests
            command: docker compose exec -T app python src/crawler/scripts/run_mutation_testing.py --pr-mode --threshold=80

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: realestate_crawler-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Start containers and setup DB
        run: |
          touch .env
          docker compose up -d app db
          # Wait for MySQL connection from within app container
          docker compose exec -T app python src/crawler/scripts/debug_tools/wait_for_db.py
          docker compose exec -T app python src/crawler/manage.py migrate

      - name: Run Tests (${{ matrix.name }})
        run: ${{ matrix.command }}


      - name: Stop containers
        if: always()
        run: docker compose down

  test:
    name: test
    needs: [changes, test-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify test results
        run: |
          if [ "${{ needs.changes.outputs.app }}" != "true" ]; then
            echo "App files not modified. Tests skipped (Passed)."
            exit 0
          fi
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "::error::One or more test matrix jobs failed."
            exit 1
          fi
          echo "All test matrix jobs passed successfully."
