name: Parser Tests

on:
  pull_request:
    branches: [ main, master, production ]
  push:
    branches: [ main, master, production ]

jobs:
  test-matrix:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
            name: Unit Tests
            path: src/crawler/tests/unit/
          - group: integration
            name: Integration Tests
            path: src/crawler/tests/integration/
          - group: ml-pipeline
            name: ML & Pipeline Tests
            path: src/crawler/tests/test_ml_pipeline.py src/crawler/tests/test_image_handler.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: realestate_crawler-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Start containers and setup DB
        run: |
          touch .env
          docker compose up -d app db
          # Wait for MySQL connection from within app container
          docker compose exec -T app python src/crawler/scripts/debug_tools/wait_for_db.py
          docker compose exec -T app python src/crawler/manage.py migrate

      - name: Run Tests (${{ matrix.name }})
        run: |
          docker compose exec -T app pytest -n auto ${{ matrix.path }}

      - name: Stop containers
        if: always()
        run: docker compose down

  test:
    name: test
    needs: test-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all test jobs passed
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "::error::One or more test matrix jobs failed."
            exit 1
          fi
          echo "All test matrix jobs passed successfully."
