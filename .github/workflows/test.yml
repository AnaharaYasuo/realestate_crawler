name: Parser Tests

on:
  pull_request:
    branches: [ main, master, production ]
  push:
    branches: [ main, master, production ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Start containers and setup DB
        run: |
          touch .env
          docker compose up -d --build app db
          # Wait for MySQL to be ready
          for i in $(seq 1 30); do
            if docker compose exec -T db mysqladmin ping -h localhost -u root -prootpassword --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          docker compose exec -T app python src/crawler/manage.py migrate

      - name: Run Parser Tests
        run: |
          docker compose exec -T app pytest src/crawler/tests/unit/

      - name: Stop containers
        if: always()
        run: docker compose down
