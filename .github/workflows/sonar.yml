name: SonarCloud Analysis

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.base_ref != 'production'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Path Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'config/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pytest.ini'
              - '.github/workflows/sonar.yml'

  sonarcloud:
    name: SonarCloud Scan
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis


      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('sonar-project.properties') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Ensure Strict Quality Gate (fail on any new issue)
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          python3 src/crawler/scripts/debug_tools/setup_strict_quality_gate.py

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            "-Dsonar.sourceEncoding=UTF-8"
            "-Dsonar.qualitygate.wait=true"
            "-Dsonar.exclusions=**/tests/**,**/testing/**,**/migrations/**,**/Temp/**,**/logs/**,**/catboost_info/**,**/.pytest_cache/**,**/__pycache__/**,**/.ruff_cache/**,**/docs/**,**/*.joblib,**/ml/models/**,**/ml/data/**,**/*.csv,**/*.png,**/*.jpg,**/*.jpeg,**/scripts/**"
            "-Dsonar.coverage.exclusions=**"
            "-Dsonar.cpd.exclusions=**/tests/**,**/testing/**,**/migrations/**,**/Temp/**,**/logs/**,**/catboost_info/**,**/.pytest_cache/**,**/__pycache__/**,**/.ruff_cache/**,**/docs/**,**/*.joblib,**/ml/models/**,**/ml/data/**,**/*.csv,**/*.png,**/*.jpg,**/*.jpeg,**/models/**,**/scripts/**,**/parser/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify Strict Zero Issues Gate (Defense-in-Depth)
        if: env.SONAR_TOKEN != ''
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 src/crawler/scripts/debug_tools/check_sonar_remote.py --pr "${{ github.event.pull_request.number }}" --strict-zero-issues
          else
            python3 src/crawler/scripts/debug_tools/check_sonar_remote.py --branch "${{ github.ref_name }}" --strict-zero-issues
          fi
