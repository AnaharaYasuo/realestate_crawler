name: Review Conversation Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master
      - production
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows:
      - "CodeQL Analysis"
      - "Security Scan (Trivy, Semgrep, Checkov)"
      - "Parser Tests"
      - "SonarCloud Analysis"
    types: [completed]

# 同一 PR の古い Gate 実行をキャンセルし、最新評価だけを残す
concurrency:
  group: review-gate-pr-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read
  statuses: write
  security-events: read
  actions: read

jobs:
  verify-conversations-resolved:
    # ジョブ名は必須チェックにしない（必須は commit status context のみ）
    name: review-gate-runner
    runs-on: ubuntu-latest
    steps:
      - name: Check unresolved review threads, checkboxes, and review status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const REQUIRED_STATUS_CONTEXT = 'Verify All Review Conversations Resolved';

            async function reportHeadStatus(headSha, state, description, summaryMd) {
              const desc = (description || '').substring(0, 140);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state,
                context: REQUIRED_STATUS_CONTEXT,
                description: desc
              });
              if (summaryMd) {
                await core.summary.addRaw(summaryMd).write();
              }
            }

            let pr = context.payload.pull_request;
            if (!pr && context.payload.issue && context.payload.issue.pull_request) {
              try {
                const prRes = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number
                });
                pr = prRes.data;
              } catch (err) {
                core.setFailed(`Failed to fetch pull request for issue #${context.payload.issue.number}: ${err.message}`);
                return;
              }
            }
            if (!pr && context.payload.workflow_run && context.payload.workflow_run.pull_requests && context.payload.workflow_run.pull_requests.length > 0) {
              try {
                const prRes = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.workflow_run.pull_requests[0].number
                });
                pr = prRes.data;
              } catch (err) {
                core.setFailed(`Failed to fetch pull request for workflow_run #${context.payload.workflow_run.id}: ${err.message}`);
                return;
              }
            }

            if (!pr) {
              core.info('No pull request found in context. Skipping.');
              return;
            }

            const targetBranch = pr.base && pr.base.ref;
            if (targetBranch !== 'master' && targetBranch !== 'production') {
              core.info(`Target branch is '${targetBranch}'. Skipping review gate.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const headSha = pr.head && pr.head.sha;
            if (!headSha) {
              core.setFailed(`PR #${prNumber} has no head SHA.`);
              return;
            }

            // Fast-pass for Production Release PRs: commits already validated on master
            const isSameRepo = pr.head && pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
            const isMasterHead = pr.head && pr.head.ref === 'master';
            if (targetBranch === 'production') {
              if (!isSameRepo || !isMasterHead) {
                core.setFailed(`Production PR must originate from internal master branch. Attempted from: ${pr.head ? pr.head.ref : 'unknown'}`);
                return;
              }
              core.info('🚀 Production PR from master detected: Bypassing review gate (verified on master).');
              await reportHeadStatus(
                headSha,
                'success',
                'Production release PR: review gate bypassed (verified on master)',
                '### 🚀 Production PR Gate Bypassed\nThis release PR promotes commits directly from `master`, where all review conversations, checkboxes, and security checks have already been validated.'
              );
              return;
            }

            // 1. Check CodeRabbit In-Progress / Pending Status (skip for production PRs)
            const systemErrors = [];
            let crPending = false;
            let crPendingMsg = '';
            let crTerminalFailure = false;
            let crTerminalFailureMsg = '';
            let allCheckRuns = [];

            if (targetBranch !== 'production') {
              try {
                const combinedStatus = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: headSha
                });
                const crStatuses = combinedStatus.data.statuses.filter(s => s.context.toLowerCase().includes('coderabbit'));
                // 同一 context は updated_at 最新を採用
                const latestStatusByContext = new Map();
                for (const s of crStatuses) {
                  const prev = latestStatusByContext.get(s.context);
                  if (!prev || new Date(s.updated_at) > new Date(prev.updated_at)) {
                    latestStatusByContext.set(s.context, s);
                  }
                }
                for (const s of latestStatusByContext.values()) {
                  if (s.state === 'pending') {
                    crPending = true;
                    crPendingMsg = `⏳ CodeRabbit review is still pending (${s.context}: ${s.state}). Please wait for CodeRabbit to complete.`;
                  } else if (s.state === 'failure' || s.state === 'error') {
                    crTerminalFailure = true;
                    crTerminalFailureMsg = `⛔ CodeRabbit status failed (${s.context}: ${s.state}).`;
                  }
                }

                allCheckRuns = await github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: headSha,
                  per_page: 100
                });
                const crChecks = allCheckRuns.filter(c => c.name.toLowerCase().includes('coderabbit'));
                const latestCheckByName = new Map();
                for (const c of crChecks) {
                  const prev = latestCheckByName.get(c.name);
                  const cTime = new Date(c.completed_at || c.started_at || 0).getTime();
                  const pTime = prev ? new Date(prev.completed_at || prev.started_at || 0).getTime() : -1;
                  if (!prev || cTime >= pTime) {
                    latestCheckByName.set(c.name, c);
                  }
                }
                for (const c of latestCheckByName.values()) {
                  if (c.status !== 'completed') {
                    crPending = true;
                    crPendingMsg = `⏳ CodeRabbit review check is in progress (${c.name}: ${c.status}). Please wait for CodeRabbit to finish.`;
                  } else if (c.conclusion !== 'success') {
                    // success 以外の完了 conclusion（failure/cancelled/timed_out/neutral/skipped/startup_failure 等）は hard failure
                    crTerminalFailure = true;
                    crTerminalFailureMsg = `⛔ CodeRabbit check failed (${c.name}: ${c.conclusion}).`;
                  }
                }

                if (crStatuses.length === 0 && crChecks.length === 0) {
                  crPending = true;
                  crPendingMsg = '⏳ CodeRabbit review has not started yet. Please wait for CodeRabbit to start.';
                }
              } catch (err) {
                systemErrors.push(`Failed to check CodeRabbit commit status / check run: ${err.message}`);
              }
            }

            // 2. Scan for Unchecked Checkboxes (- [ ])
            function extractUnchecked(text, sourceDesc) {
              if (!text) return [];
              const lines = text.split(/\r?\n/);
              const items = [];
              for (const line of lines) {
                const m = line.match(/^[ \t]*[-*][ \t]+\[([ ])\][ \t]*(.*)$/);
                if (m) {
                  // Ignore CodeRabbit interactive action triggers (radio choices, automated CI-fix triggers)
                  if (line.includes('radioGroupId') || line.includes('checkboxId') || line.includes('Fix all pre-merge checks with AI')) {
                    continue;
                  }
                  const content = m[2].trim();
                  const clean = content.replace(/<!--.*?-->/g, '').trim();
                  items.push({ source: sourceDesc, text: clean || content || '(No description)' });
                }
              }
              return items;
            }

            const uncheckedList = [];

            // 2a. PR description body
            uncheckedList.push(...extractUnchecked(pr.body, 'PR 本文 (Description)'));

            // 2b. Pull Request Reviews
            let allReviews = [];
            try {
              const reviewsRes = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: prNumber
              });
              allReviews = reviewsRes;
              for (const r of allReviews) {
                if (r.state === 'DISMISSED') {
                  continue;
                }
                const author = r.user ? r.user.login : 'unknown';
                uncheckedList.push(...extractUnchecked(r.body, `Review by @${author} (ID: ${r.id})`));
              }
            } catch (err) {
              systemErrors.push(`Failed to list PR reviews: ${err.message}`);
            }

            // 2c. Issue Comments
            try {
              const commentsRes = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber
              });
              for (const c of commentsRes) {
                const author = c.user ? c.user.login : 'unknown';
                uncheckedList.push(...extractUnchecked(c.body, `Comment by @${author} (ID: ${c.id})`));
              }
            } catch (err) {
              systemErrors.push(`Failed to list Issue comments: ${err.message}`);
            }

            // 2d. Review Comments (Inline)
            try {
              const reviewCommentsRes = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number: prNumber
              });
              for (const rc of reviewCommentsRes) {
                const author = rc.user ? rc.user.login : 'unknown';
                uncheckedList.push(...extractUnchecked(rc.body, `Inline comment by @${author} (${rc.path}:${rc.line || rc.original_line || '-'})`));
              }
            } catch (err) {
              systemErrors.push(`Failed to list Review comments: ${err.message}`);
            }

            // 3. Scan Unresolved Review Threads via GraphQL
            const threadQuery = `
              query($owner: String!, $repo: String!, $prNumber: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        id
                        isResolved
                        path
                        line
                        comments(first: 1) {
                          nodes {
                            author { login }
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let hasNextPage = true;
            let cursor = null;
            const allThreads = [];

            try {
              while (hasNextPage) {
                const variables = { owner, repo, prNumber, cursor };
                const result = await github.graphql(threadQuery, variables);
                const connection = result.repository.pullRequest.reviewThreads;
                allThreads.push(...connection.nodes);
                const hasMorePages = connection.pageInfo.hasNextPage;
                const nextCursor = connection.pageInfo.endCursor;
                if (hasMorePages && (!nextCursor || nextCursor === cursor)) {
                  throw new Error('GitHub GraphQL reviewThreads pagination did not advance.');
                }
                hasNextPage = hasMorePages;
                cursor = nextCursor;
              }
            } catch (err) {
              systemErrors.push(`Failed to fetch review threads via GraphQL: ${err.message}`);
            }

            const unresolved = allThreads.filter(t => !t.isResolved);

            // 4. Check for CHANGES_REQUESTED in reviews
            // Find latest review state per user
            const latestReviewByUser = new Map();
            for (const r of allReviews) {
              if (r.user && r.state && r.state !== 'COMMENTED' && r.state !== 'DISMISSED') {
                latestReviewByUser.set(r.user.login, r);
              }
            }

            const changesRequested = [];
            const staleChangesRequested = [];
            for (const [user, r] of latestReviewByUser.entries()) {
              if (r.state === 'CHANGES_REQUESTED') {
                const isCodeRabbit = user.toLowerCase().includes('coderabbit');
                // CodeRabbit 由来で、かつレビュー時のコミットが最新 HEAD SHA と異なる場合は新コミット後の再評価待ち
                if (isCodeRabbit && r.commit_id && r.commit_id !== headSha) {
                  staleChangesRequested.push({ user, reviewId: r.id, commitId: r.commit_id });
                } else {
                  changesRequested.push({ user, reviewId: r.id, commitId: r.commit_id });
                }
              }
            }

            // 新コミットプッシュ時に CodeRabbit の未解決指摘または古い変更要求があれば自動で再レビューをリクエスト
            const hasCodeRabbitUnresolved = unresolved.some(t => {
              const firstComment = t.comments && t.comments.nodes && t.comments.nodes[0];
              const author = firstComment && firstComment.author ? firstComment.author.login : '';
              return author.toLowerCase().includes('coderabbit');
            });

            if (staleChangesRequested.length > 0 || (hasCodeRabbitUnresolved && context.eventName === 'pull_request' && context.payload.action === 'synchronize')) {
              const hasRecentTrigger = (allReviews || []).some(r => 
                (new Date() - new Date(r.submitted_at)) < 180000
              );
              try {
                console.log('🤖 新コミット検知: CodeRabbit の自動再評価をリクエストします。');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: '@coderabbitai review'
                });
              } catch (e) {
                console.warn('CodeRabbit再レビューの自動リクエストに失敗:', e.message);
              }
            }

            // 5. Check Security Scans & Code Scanning Status (skip for production PRs)
            const requiredSecurityChecks = targetBranch !== 'production' ? [
              { name: 'CodeQL Scan', match: (n) => n.toLowerCase().includes('codeql scan') },
              { name: 'Trivy Security Scan', match: (n) => n.toLowerCase().includes('trivy') },
              { name: 'Semgrep SAST Scan', match: (n) => n.toLowerCase().includes('semgrep') },
              { name: 'Checkov IaC Scan', match: (n) => n.toLowerCase().includes('checkov') }
            ] : [];

            const allowedConclusions = ['success'];
            const failedSecurityChecks = [];
            const pendingSecurityChecks = [];
            const missingSecurityChecks = [];

            for (const req of requiredSecurityChecks) {
              const matched = allCheckRuns.filter(c => req.match(c.name || ''));
              if (matched.length === 0) {
                missingSecurityChecks.push(req.name);
                continue;
              }
              for (const c of matched) {
                if (c.status !== 'completed') {
                  pendingSecurityChecks.push({ name: c.name, status: c.status });
                } else if (!allowedConclusions.includes(c.conclusion)) {
                  failedSecurityChecks.push({ name: c.name, conclusion: c.conclusion });
                }
              }
            }

            const codeScanningAlerts = [];
            if (targetBranch !== 'production') {
              try {
                let alertsRes = null;
                try {
                  alertsRes = await github.rest.codeScanning.listAlertsForRepo({
                    owner,
                    repo,
                    ref: `refs/pull/${prNumber}/merge`,
                    state: 'open',
                    per_page: 50
                  });
                } catch (mergeRefErr) {
                  if (pr.head && pr.head.ref) {
                    alertsRes = await github.rest.codeScanning.listAlertsForRepo({
                      owner,
                      repo,
                      ref: `refs/heads/${pr.head.ref}`,
                      state: 'open',
                      per_page: 50
                    });
                  } else {
                    throw mergeRefErr;
                  }
                }

                if (alertsRes && alertsRes.data) {
                  for (const a of alertsRes.data) {
                    codeScanningAlerts.push({
                      number: a.number,
                      tool: a.tool ? a.tool.name : 'Unknown',
                      rule: a.rule ? a.rule.id : 'Unknown',
                      severity: a.rule ? a.rule.severity : 'error',
                      desc: a.rule ? a.rule.description : '',
                      path: a.most_recent_instance && a.most_recent_instance.location ? a.most_recent_instance.location.path : ''
                    });
                  }
                }
              } catch (err) {
                systemErrors.push(`Failed to fetch code scanning alerts: ${err.message}`);
              }
            }

            // 6. Aggregate Results — pending (wait) vs failure (hard) vs success
            let hasFailure = false;
            let isPending = false;
            let summaryMd = '';
            const pendingReasons = [];

            if (systemErrors.length > 0) {
              hasFailure = true;
              summaryMd += `### ⛔ システムエラー (${systemErrors.length}件)\n\n`;
              for (const err of systemErrors) {
                summaryMd += `- ${err}\n`;
              }
              summaryMd += '\n';
            }

            if (crTerminalFailure) {
              hasFailure = true;
              summaryMd += `### ⛔ CodeRabbitチェック失敗\n\n${crTerminalFailureMsg}\n\n`;
            }

            if (crPending) {
              isPending = true;
              pendingReasons.push(crPendingMsg || 'CodeRabbit review pending');
              summaryMd += `### ⏳ CodeRabbitレビュー実行中\n\n${crPendingMsg}\n\n`;
            }

            if (unresolved.length > 0) {
              hasFailure = true;
              summaryMd += `### ⛔ 未解決のレビュー会話スレッド (${unresolved.length}件)\n\n`;
              summaryMd += `PRをマージするには、CodeRabbitおよびレビュアーからのすべての指摘に対応し、会話スレッドを「**Resolve conversation**」してください。\n\n`;
              summaryMd += `| ファイル | 行 | レビュアー | コメント抜粋 |\n`;
              summaryMd += `| :--- | :--- | :--- | :--- |\n`;
              for (const t of unresolved) {
                const file = t.path || 'Unknown';
                const line = t.line || '-';
                const comment = t.comments.nodes[0] || {};
                const author = comment.author ? comment.author.login : 'Unknown';
                const snippet = (comment.body || '').replace(/[\r\n]+/g, ' ').substring(0, 80);
                summaryMd += `| \`${file}\` | ${line} | @${author} | ${snippet}... |\n`;
              }
              summaryMd += '\n';
            }

            if (uncheckedList.length > 0) {
              hasFailure = true;
              summaryMd += `### ⛔ 未完了のチェックボックス (\`- [ ]\`) (${uncheckedList.length}件)\n\n`;
              summaryMd += `PRをマージするには、PR本文、CodeRabbitレビュー、各種コメント内のすべてのチェックボックスにチェック（\`- [x]\`）を入れてください。\n\n`;
              summaryMd += `| 検出元 | 項目内容 |\n`;
              summaryMd += `| :--- | :--- |\n`;
              for (const u of uncheckedList) {
                summaryMd += `| ${u.source} | ${u.text} |\n`;
              }
              summaryMd += '\n';
            }

            if (changesRequested.length > 0) {
              hasFailure = true;
              summaryMd += `### ⛔ レビュアーからの変更要求 (Changes Requested) (${changesRequested.length}件)\n\n`;
              summaryMd += `以下のレビュアーによる変更要求が残存しています。指摘に対応して承認（Approved）を得てください。\n\n`;
              for (const cr of changesRequested) {
                summaryMd += `- @${cr.user} (Review ID: ${cr.reviewId})\n`;
              }
              summaryMd += '\n';
            }

            if (staleChangesRequested.length > 0) {
              isPending = true;
              pendingReasons.push(`Waiting for CodeRabbit re-evaluation after new commit (${staleChangesRequested.map(r => '@' + r.user).join(', ')})`);
              summaryMd += `### ⏳ 新コミットに対する CodeRabbit の再評価待ち (${staleChangesRequested.length}件)\n\n`;
              summaryMd += `修正コミットがプッシュされたため、CodeRabbit による再レビュー完了を待機しています。\n\n`;
              for (const scr of staleChangesRequested) {
                summaryMd += `- @${scr.user} (直前の変更要求: Review ID ${scr.reviewId}, 対象コミット: \`${(scr.commitId || '').substring(0, 7)}\`)\n`;
              }
              summaryMd += '\n';
            }

            if (missingSecurityChecks.length > 0) {
              isPending = true;
              pendingReasons.push(`Missing security checks: ${missingSecurityChecks.join(', ')}`);
              summaryMd += `### ⏳ 未検出の必須セキュリティスキャン (${missingSecurityChecks.length}件)\n\n`;
              summaryMd += `スキャン未開始のため待機します（failure にはしません）。\n\n`;
              for (const mc of missingSecurityChecks) {
                summaryMd += `- \`${mc}\` が見つかりません\n`;
              }
              summaryMd += '\n';
            }

            if (pendingSecurityChecks.length > 0) {
              isPending = true;
              pendingReasons.push(`Pending security checks: ${pendingSecurityChecks.length}`);
              summaryMd += `### ⏳ セキュリティスキャン実行中 (${pendingSecurityChecks.length}件)\n\n`;
              summaryMd += `以下のセキュリティスキャンが実行中です。完了をお待ちください。\n\n`;
              for (const pc of pendingSecurityChecks) {
                summaryMd += `- \`${pc.name}\`: **${pc.status}**\n`;
              }
              summaryMd += '\n';
            }

            if (failedSecurityChecks.length > 0) {
              hasFailure = true;
              summaryMd += `### ⛔ セキュリティスキャンの失敗 (${failedSecurityChecks.length}件)\n\n`;
              summaryMd += `PRをマージするには、すべてのセキュリティスキャン（CodeQL, Trivy, Semgrep, Checkov）を通過させる必要があります。\n\n`;
              summaryMd += `| チェック名 | 結果 |\n`;
              summaryMd += `| :--- | :--- |\n`;
              for (const fc of failedSecurityChecks) {
                summaryMd += `| \`${fc.name}\` | **${fc.conclusion}** |\n`;
              }
              summaryMd += '\n';
            }

            if (codeScanningAlerts.length > 0) {
              hasFailure = true;
              summaryMd += `### ⛔ 未解消の Code Scanning アラート (${codeScanningAlerts.length}件)\n\n`;
              summaryMd += `PRブランチにおいて未解消の Code Scanning アラートが検出されました。マージ前に解消してください。\n\n`;
              summaryMd += `| # | ツール | ルール | 重大度 | パス | 内容 |\n`;
              summaryMd += `| :--- | :--- | :--- | :--- | :--- | :--- |\n`;
              for (const a of codeScanningAlerts) {
                summaryMd += `| #${a.number} | ${a.tool} | \`${a.rule}\` | ${a.severity} | \`${a.path}\` | ${a.desc} |\n`;
              }
              summaryMd += '\n';
            }

            // 単一 commit status のみ報告（ジョブ名と同名の checks.create は行わない）
            if (hasFailure) {
              console.error('⛔ Review Gate Check Failed (hard failure):');
              if (systemErrors.length > 0) console.error(`- System errors: ${systemErrors.length}`);
              if (crTerminalFailure) console.error(`- CodeRabbit terminal failure: ${crTerminalFailureMsg}`);
              if (unresolved.length > 0) console.error(`- Unresolved threads: ${unresolved.length}`);
              if (uncheckedList.length > 0) console.error(`- Unchecked checkboxes: ${uncheckedList.length}`);
              if (changesRequested.length > 0) console.error(`- Changes requested: ${changesRequested.length}`);
              if (failedSecurityChecks.length > 0) console.error(`- Failed security checks: ${failedSecurityChecks.length}`);
              if (codeScanningAlerts.length > 0) console.error(`- Open code scanning alerts: ${codeScanningAlerts.length}`);
              try {
                await reportHeadStatus(
                  headSha,
                  'failure',
                  `PR #${prNumber}: hard gate failure`,
                  summaryMd
                );
              } catch (err) {
                core.setFailed(`Failed to sync commit status to HEAD SHA: ${err.message}`);
                return;
              }
              core.setFailed(`PR #${prNumber} cannot be merged: ${unresolved.length} unresolved threads, ${uncheckedList.length} unchecked checkboxes, ${changesRequested.length} changes requested, ${failedSecurityChecks.length} failed security checks, ${codeScanningAlerts.length} code scanning alerts.`);
              return;
            }

            if (isPending) {
              console.log('⏳ Review Gate pending (waiting — not a failure):', pendingReasons.join('; '));
              try {
                await reportHeadStatus(
                  headSha,
                  'pending',
                  (pendingReasons[0] || 'Waiting for reviews/security').substring(0, 140),
                  summaryMd
                );
              } catch (err) {
                core.setFailed(`Failed to sync commit status to HEAD SHA: ${err.message}`);
                return;
              }
              // ジョブは成功終了し、sticky failure を残さない
              return;
            }

            console.log('✅ すべての会話スレッドが解決済み、すべてのチェックボックスが完了、変更要求なし。マージ可能です。');
            try {
              await reportHeadStatus(
                headSha,
                'success',
                `PR #${prNumber}: review gate passed`,
                `### ✅ Review Conversations & Checkboxes Check Passed\n\nすべてのレビュー会話スレッド（${allThreads.length}件走査）が解決され、未完了のチェックボックス、セキュリティスキャン失敗、および未解消のCode Scanningアラートは存在しません。マージ可能です。\n`
              );
            } catch (err) {
              core.setFailed(`Failed to sync commit status to HEAD SHA: ${err.message}`);
              return;
            }
