name: Production PR Gate

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-pr-source:
    name: Verify Source Branch is master
    runs-on: ubuntu-latest
    steps:
      - name: Verify that PR source is master
        run: |
          echo "Target branch (base): ${{ github.base_ref }}"
          echo "Source branch (head): ${{ github.head_ref }}"
          if [ "${{ github.head_ref }}" != "master" ]; then
            echo "::error::Only pull requests from 'master' are allowed into 'production'. (Attempted from: ${{ github.head_ref }})"
            exit 1
          fi
          echo "Source branch is master. Verification passed."

      - name: Comment and close invalid PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '⛔ **マージ不可**: `production` への Pull Request は `master` ブランチからのみ許可されています。\nブランチ `' + context.payload.pull_request.head.ref + '` からの直接 PR は受け付けられません。\n作業ブランチをまず `master` へマージした後、`master` から `production` への PR を作成してください。'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
