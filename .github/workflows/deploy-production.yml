name: Deploy Production

on:
  push:
    branches:
      - production
  # Auto-merge by GITHUB_TOKEN does not emit a push that triggers workflows; auto-release-pr.yml dispatches instead.
  workflow_dispatch:

# A newer pending run may replace an older pending one; it deploys its own newer github.sha,
# which contains the older commit because production only advances by merges.
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test-and-scan:
    name: Run Security Scan
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          exit-code: '1'

  terraform-apply:
    name: Terraform Apply (Production Infrastructure)
    needs: test-and-scan
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="project_id=sumifu" -var="environment=prod"

  build-and-deploy-container:
    name: Build & Deploy Container to Cloud Run
    needs: terraform-apply
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:latest
            asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }}

      - name: Run Database Migrations on Cloud SQL
        run: |
          gcloud run jobs update realestate-migrate-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/manage.py,migrate,--noinput \
            --region=asia-northeast1
          gcloud run jobs execute realestate-migrate-prod \
            --region=asia-northeast1 \
            --wait

      - name: Update Cloud Run Job Image
        run: |
          CRAWLER_TIMEOUT_SEC=$(awk '/^variable "crawler_timeout"/{f=1} f && /^[[:space:]]*default[[:space:]]*=/{gsub(/[^0-9]/, ""); print; exit}' terraform/variables.tf)
          test -n "$CRAWLER_TIMEOUT_SEC"
          gcloud run jobs update realestate-crawler-pipeline-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/scripts/ops/run_pipeline.py \
            --max-retries=0 \
            --task-timeout=${CRAWLER_TIMEOUT_SEC}s \
            --update-env-vars=CLOUD_RUN_JOB_TIMEOUT_SEC=${CRAWLER_TIMEOUT_SEC} \
            --region=asia-northeast1

      - name: Update Cloud Run Service Image
        run: |
          gcloud run services update realestate-slack-agent-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/scripts/ops/run_slack_agent.py \
            --region=asia-northeast1

      - name: Update Cloud Run API Service Image
        run: |
          gcloud run services update realestate-api-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/main.py \
            --region=asia-northeast1

      - name: Update Crawler Worker Service Image
        run: |
          gcloud run services update realestate-crawler-worker-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/main.py \
            --region=asia-northeast1

      - name: Update Crawler Dispatcher Job Image
        run: |
          gcloud run jobs update realestate-crawler-dispatcher-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/scripts/ops/run_dispatcher.py \
            --region=asia-northeast1

      - name: Update ML Pipeline Job Image
        run: |
          gcloud run jobs update realestate-ml-pipeline-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/scripts/ops/run_ml_pipeline.py \
            --args=--force \
            --max-retries=0 \
            --task-timeout=3600s \
            --region=asia-northeast1

      - name: Update Safety Net Job Image
        run: |
          gcloud run jobs update realestate-safety-net-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/scripts/ensure_resources_stopped.py \
            --args=--project-id=sumifu,--region=asia-northeast1,--instance-name=proxysql-instance-prod \
            --region=asia-northeast1

      - name: Update Recrawl Anomalies Job Image
        run: |
          gcloud run jobs update realestate-recrawl-anomalies-prod \
            --image=asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler:${{ github.sha }} \
            --command=python,src/crawler/scripts/maintenance/recrawl_anomalies.py \
            --region=asia-northeast1

      - name: Prune old images (Keep latest 3 versions)
        # Executed only after all jobs and services have successfully updated their image references
        run: |
          set -euo pipefail
          echo "Pruning Artifact Registry images, keeping latest 3 versions..."
          old_digests=$(gcloud artifacts docker images list \
            asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler \
            --sort-by=~CREATE_TIME \
            --format="value(version)" | sed -e '1,3d' || true)
          if [ -n "$old_digests" ]; then
            while read -r digest; do
              if [ -n "$digest" ]; then
                echo "Deleting old image digest: $digest"
                if ! gcloud artifacts docker images delete \
                  "asia-northeast1-docker.pkg.dev/sumifu/realestate-crawler-prod/crawler@$digest" \
                  --quiet --delete-tags; then
                  echo "::warning::Failed to delete image digest: $digest"
                fi
              fi
            done <<< "$old_digests"
          fi

      - name: Notify New Relic Deployment (Change Tracking)
        # Record deployment marker in New Relic for performance impact tracking (Issue #562 #5, CodeRabbit review)
        # Executed at the very end after all services and jobs are updated
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          # GUID of the realestate-api-prod APM entity
          NEW_RELIC_ENTITY_GUID: ${{ secrets.NEW_RELIC_ENTITY_GUID }}
        run: |
          pip install --quiet python-dotenv || true
          python src/crawler/scripts/notify_new_relic_deployment.py \
            --version "${{ github.sha }}" \
            --commit "${{ github.sha }}" \
            --changelog "Production deploy triggered by ${{ github.actor }}" \
            --user "${{ github.actor }}" \
            --entity-guid "$NEW_RELIC_ENTITY_GUID" \
            --timeout 10 || echo "New Relic deployment notification failed (non-blocking)"



