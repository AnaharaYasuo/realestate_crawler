version: 2
updates:
  # Poetry (pyproject.toml / poetry.lock) — Dependabot pip ecosystem detects Poetry
  - package-ecosystem: "pip"
    directory: "/src/crawler"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
